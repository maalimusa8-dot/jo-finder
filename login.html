<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Jo Finder</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            background: #f5f5f5; 
        }
        nav { 
            background: #2c3e50; 
            padding: 15px 10px; 
            text-align: center;
        }
        nav a { 
            color: white; 
            margin: 0 12px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 16px;
        }
        nav a:hover { color: #27ae60; }
        .container {
            max-width: 400px; 
            margin: 60px auto; 
            padding: 0 20px;
        }
        .login-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #1d4ed8; }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="jobs2.html">الوظائف</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        <a href="login.html" id="loginLink">تسجيل الدخول</a>
        <a href="#" id="logoutLink" onclick="logout()" style="display:none;">خروج</a>
    </nav>
    
    <div class="container">
        <div class="login-box">
            <h1>تسجيل الدخول</h1>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <p class="error" id="errorMsg">اسم المستخدم أو كلمة المرور غلط</p>
            
            <!-- رابط إنشاء حساب جديد -->
            <div style="text-align:center; margin-top:20px;">
                ما عندك حساب؟ <a href="register.html" style="color:#2563eb; font-weight:bold;">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <script>
        // كود تسجيل الدخول والخروج
        if(localStorage.getItem('loggedIn') === 'true') {
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('logoutLink').style.display = 'inline-block';
        }
        
        function logout() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        }

        // تسجيل الدخول - يدعم الحسابات الجديدة
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if(!user || !pass) {
                errorMsg.innerText = 'املأ اسم المستخدم وكلمة المرور';
                errorMsg.style.display = 'block';
                return;
            }

            // جيب المستخدمين المسجلين
            let users = JSON.parse(localStorage.getItem('users')) || [];
            const foundUser = users.find(u => u.username === user && u.password === pass);
            
            if(foundUser) {
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('username', user);
                window.location.href = 'index.html';
            } else {
                errorMsg.innerText = 'اسم المستخدم أو كلمة المرور غلط';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
    </html>
