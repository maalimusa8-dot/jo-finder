<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo Finder - منصة الوظائف</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            text-align: center;
        }
        nav { 
            background: #2c3e50; 
            padding: 15px 10px; 
            text-align: center;
        }
        nav a { 
            color: white; 
            margin: 0 12px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
        }
        nav a:hover { color: #27ae60; }
        .header {
            background: #2c3e50;
            color: white;
            padding: 60px 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .header p {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 15px 30px;
            margin: 30px 0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn:hover {
            background: #219a52;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .footer {
            background: #34495e;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="jobs2.html">الوظائف</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        <a href="login.html" id="loginLink">تسجيل الدخول</a>
        <a href="#" id="logoutLink" onclick="logout()" style="display:none;">خروج</a>
    </nav>

    <div class="header">
        <h1>مرحباً بك في Jo Finder</h1>
        <p>منصتك الأولى للبحث عن أفضل الفرص الوظيفية</p>
        <a href="jobs2.html" class="btn">تصفح الوظائف الآن</a>
    </div>

    <div class="container">
        <h2>لماذا Jo Finder؟</h2>
        <p>نوفر لك مئات الوظائف المحدثة يومياً في كل المجالات والتخصصات</p>
    </div>

    <div class="footer">
        <p>© 2026 Jo Finder - جميع الحقوق محفوظة</p>
    </div>

    <script>
        // كود تسجيل الدخول والخروج
        if(localStorage.getItem('loggedIn') === 'true') {
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('logoutLink').style.display = 'inline-block';
        }

        function logout() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
