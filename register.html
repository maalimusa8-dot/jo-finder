<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Jo Finder</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            background: #f5f5f5; 
        }
        nav { 
            background: #2c3e50; 
            padding: 15px 10px; 
            text-align: center;
        }
        nav a { 
            color: white; 
            margin: 0 12px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 16px;
        }
        nav a:hover { color: #27ae60; }
        .container {
            max-width: 400px; 
            margin: 60px auto; 
            padding: 0 20px;
        }
        .register-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #219150; }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="jobs2.html">الوظائف</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        <a href="login.html" id="loginLink">تسجيل الدخول</a>
        <a href="#" id="logoutLink" onclick="logout()" style="display:none;">خروج</a>
    </nav>
    
    <div class="container">
        <div class="register-box">
            <h1>إنشاء حساب جديد</h1>
            <input type="text" id="newUsername" placeholder="اسم المستخدم">
            <input type="email" id="newEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="newPassword" placeholder="كلمة المرور">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
            <button onclick="register()">إنشاء الحساب</button>
            <p class="error" id="errorMsg"></p>
            <div class="login-link">
                عندك حساب؟ <a href="login.html">سجل دخول</a>
            </div>
        </div>
    </div>

    <script>
        // كود تسجيل الدخول والخروج
        if(localStorage.getItem('loggedIn') === 'true') {
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('logoutLink').style.display = 'inline-block';
        }
        function logout() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        }

        // كود إنشاء الحساب
        function register() {
            const user = document.getElementById('newUsername').value;
            const email = document.getElementById('newEmail').value;
            const pass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if(!user || !email || !pass) {
                errorMsg.innerText = 'املأ كل الحقول';
                errorMsg.style.display = 'block';
                return;
            }
            if(pass !== confirmPass) {
                errorMsg.innerText = 'كلمة المرور غير متطابقة';
                errorMsg.style.display = 'block';
                return;
            }
            if(pass.length < 4) {
                errorMsg.innerText = 'كلمة المرور لازم 4 حروف على الأقل';
                errorMsg.style.display = 'block';
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            if(users.find(u => u.username === user)) {
                errorMsg.innerText = 'اسم المستخدم موجود مسبقاً';
                errorMsg.style.display = 'block';
                return;
            }

            users.push({username: user, email: email, password: pass});
            localStorage.setItem('users', JSON.stringify(users));
            
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('username', user);
            
            alert('تم إنشاء الحساب بنجاح! ح تدخلي طوالي');
            window.location.href = 'index.html';
        }
    </script>
</body>
                </html>
