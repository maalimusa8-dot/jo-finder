<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder - تسجيل جديد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-box">
        <h2>إنشاء حساب جديد</h2>
        <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="name">
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="password">
        </div>
        <a href="login.html" class="btn" style="display:block; text-align:center; text-decoration:none; padding:14px; background:#5e72e4; color:white; border-radius:8px; font-size:18px; font-weight:bold;">تسجيل</a>
        <p class="signup-link">
            عندك حساب؟ <a href="login.html">سجل دخول</a>
        </p>
    </div>
</body>
</html>
