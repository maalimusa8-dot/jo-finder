<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder - أضف وظيفة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="logo">JobFinder</h1>
        <ul class="nav-links">
            <li><a href="home.html">الرئيسية</a></li>
            <li><a href="jobs.html">الوظائف</a></li>
            <li><a href="add-job.html" class="active">أضف وظيفة</a></li>
            <li><a href="#" id="logoutBtn">خروج</a></li>
        </ul>
    </nav>
    
    <div class="form-box">
        <h2>أضف وظيفة جديدة</h2>
        <form id="addJobForm">
            <div class="form-group">
                <label>عنوان الوظيفة</label>
                <input type="text" id="jobTitle" required>
            </div>
            <div class="form-group">
                <label>اسم الشركة</label>
                <input type="text" id="company" required>
            </div>
            <div class="form-group">
                <label>وصف الوظيفة</label>
                <textarea id="description" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">إضافة الوظيفة</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
